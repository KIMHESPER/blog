<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="styles.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#131313",
                        "surface": "#131313",
                        "primary": "#adc6ff",
                        "on-primary": "#002e6a",
                        "on-surface": "#e5e2e1",
                        "on-surface-variant": "#c2c6d6",
                        "outline-variant": "#424754",
                    },
                    fontFamily: {
                        "headline": ["Outfit", "Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "mono": ["JetBrains Mono"]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        .tech-noir-glow { box-shadow: 0 0 60px -15px rgba(173, 198, 255, 0.15); }
    </style>
</head>
<body class="bg-surface text-on-surface selection:bg-primary/30">
    <!-- TopNavBar (Fixed) -->
    <nav class="fixed top-0 w-full z-50 bg-surface/60 backdrop-blur-xl border-b border-outline-variant/10">
        <div class="flex justify-between items-center px-8 py-4 max-w-7xl mx-auto w-full">
            <div class="text-2xl font-black tracking-tighter text-[#adc6ff]">KANGSEJONG</div>
            <div class="hidden md:flex gap-8 items-center">
                <a class="text-[#adc6ff] border-b-2 border-[#adc6ff] pb-1 font-medium transition-colors" href="#page-0">Home</a>
                <a class="text-slate-400 hover:text-[#adc6ff] font-medium transition-colors" href="#page-1">Journey</a>
                <a class="text-slate-400 hover:text-[#adc6ff] font-medium transition-colors" href="#">Portfolio</a>
                <a class="text-slate-400 hover:text-[#adc6ff] font-medium transition-colors" href="#">About</a>
            </div>
            <div class="flex gap-4 items-center text-[#adc6ff]">
                <span class="material-symbols-outlined">terminal</span>
                <span class="font-mono text-xs hidden sm:block">SYS_ACTIVE_50_PAGES</span>
            </div>
        </div>
    </nav>

    <!-- Side Navigation Dots -->
    <div id="side-dots" class="side-nav">
        <!-- Dots will be injected here -->
    </div>

    <!-- Scrolly Container -->
    <div id="scroll-container" class="scroll-container">
        <!-- Hero Section (Page 0) -->
        <section id="page-0" class="snap-section bg-surface">
            <div class="absolute inset-0 z-0">
                <div class="absolute top-1/4 -left-20 w-96 h-96 bg-primary/10 rounded-full blur-[120px]"></div>
                <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-primary/5 rounded-full blur-[120px]"></div>
            </div>
            <div class="max-w-7xl mx-auto px-8 w-full z-10 text-center">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container-high text-primary border border-outline-variant/15 mb-6 reveal-text">
                    <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                    <span class="font-mono text-xs uppercase tracking-widest">Digital Odyssey Initiated</span>
                </div>
                <h1 class="font-headline text-7xl md:text-9xl font-black tracking-tighter leading-tight mb-8 reveal-text reveal-delay-1">
                    KANG<br />
                    <span class="text-transparent bg-clip-text bg-gradient-to-br from-primary via-primary-container to-tertiary-container italic">SEJONG</span>
                </h1>
                <p class="font-headline text-2xl md:text-3xl text-on-surface-variant/80 font-light max-w-2xl mx-auto mb-10 reveal-text reveal-delay-2">
                    50개 이상의 장면으로 펼쳐지는<br/>공학도의 성장 기록
                </p>
                <div class="flex justify-center gap-4 reveal-text reveal-delay-3">
                    <button class="bg-primary text-on-primary px-10 py-4 rounded-xl font-bold tech-noir-glow hover:scale-105 transition-transform" onclick="document.getElementById('page-1').scrollIntoView()">
                        SCROLL_TO_START
                    </button>
                </div>
                <div class="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce text-primary/40">
                    <span class="material-symbols-outlined text-4xl">keyboard_double_arrow_down</span>
                </div>
            </div>
        </section>

        <!-- Dynamic Pages will be injected here -->
    </div>

    <script src="main.js"></script>
</body>
</html>
